[package]
name = "kot"
version = "0.0.3"
edition = "2024"
rust-version = "1.85"
authors = ["Khashayar Fereidani"]
description = "A fast OCI container runtime for Linux that links no container libraries, with an in-process seccomp compiler, its own systemd D-Bus client, and cgroup v1 and v2 at full parity"
repository = "https://github.com/fereidani/kot"
documentation = "https://docs.rs/kot"
keywords = ["oci", "container", "runtime", "seccomp", "cgroups"]
categories = ["virtualization", "os::linux-apis", "command-line-utilities"]
license = "MIT"

[lib]
name = "kot"
path = "src/lib.rs"

[[bin]]
name = "kot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bumpalo = { version = "3.20.3", features = ["collections"] }
rustix = { version = "1.1.5", default-features = false, features = [
    "event",
    "fs",
    "mm",
    "mount",
    "net",
    "param",
    "pipe",
    "process",
    "pty",
    "runtime",
    "std",
    "stdio",
    "system",
    "termios",
    "thread",
    "time",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
